name: Integración Continua (CI) - Sistema Trajes SDLC

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Instalar dependencias del proyecto
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 pytest-cov

    - name: Análisis estático de sintaxis y estilo (Linter)
      run: |
        # Detener la compilación si hay errores de sintaxis Python o nombres no definidos
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Advertencia de complejidad y estilo
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Ejecutar Suite de Pruebas Unitarias e Integración
      run: |
        pytest tests/ -v --junitxml=test-results.xml --cov=app --cov-report=term-missing

    - name: Publicar reporte de resultados de pruebas
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: test-results.xml
